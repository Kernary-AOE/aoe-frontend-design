# Scout catalog source manifest — the git-tracked declaration face of a
# capability whose payload is NOT git-tracked.
#
# Every field here was measured, not copied: `bytes`, `sha256`,
# `declaredEntryCount` and `loadableEntryCount` come from reading the 18 JSON
# payloads through `src/loader.ts`'s normalisation on 2026-08-29. See
# `docs/analysis/corpus-ownership/02-scout-catalog.md` for the measurement and
# `README.md` for why the payload stays out of git.
#
# `loadableEntryCount` < `declaredEntryCount` is not a rounding error: it is the
# count of records the normaliser keeps after dropping those with neither a title
# nor a URL. Only `footer-design` differs (763 declared, 646 loadable, 117
# dropped), and the loader raises SCOUT_ENTRY_COUNT_DRIFT when a payload stops
# matching this number — which is the whole point of recording it.

protocol: prime/scout-catalog/v1
adapter: scout-catalog

# Feature weights for `src/search.ts`. Externalised because the legacy
# implementation hardcoded a five-name CURATED_SOURCES set inside a scoring
# function (`mcp-server/index.ts:493`), which made source authority
# unauditable and unchangeable without a code edit.
retrieval:
  weights:
    titleMatch: 0.45
    textMatch: 0.2
    sourceAffinity: 0.15
    assetPresence: 0.1
    curatedSource: 0.1
  defaultLimit: 10
  maxLimit: 50
  minTokenLength: 2

