id: "@anthropic-impeccable/anti-pattern-gray-on-colored-bg"
kind: anti-pattern
version: "1.0.0"
description: "Using achromatic gray text (oklch(X% 0 0)) on any non-white colored background. The gray appears washed-out, lifeless, and loses legibility because the chroma conflict between a chromatic background and achromatic text creates visual dissonance."
