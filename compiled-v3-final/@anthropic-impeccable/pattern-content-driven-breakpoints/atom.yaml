id: "@anthropic-impeccable/pattern-content-driven-breakpoints"
kind: pattern
version: "1.0.0"
description: "Responsive breakpoints should be placed where the content actually breaks — not at device-convention widths. Additionally, screen size alone does not reveal input method; use pointer and hover media queries to adapt to touch vs. cursor devices independently of viewport width."
