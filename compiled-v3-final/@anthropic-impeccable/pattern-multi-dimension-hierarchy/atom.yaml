id: "@anthropic-impeccable/pattern-multi-dimension-hierarchy"
kind: pattern
version: "1.0.0"
description: "Strong visual hierarchy requires combining at least two of the five hierarchy dimensions simultaneously on primary elements: size, weight, color contrast, position, and surrounding whitespace. Single-dimension hierarchy (size alone, or color alone) is weak and fails the squint test."
