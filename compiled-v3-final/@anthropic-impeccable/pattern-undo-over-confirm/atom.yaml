id: "@anthropic-impeccable/pattern-undo-over-confirm"
kind: pattern
version: "1.0.0"
description: "For reversible destructive actions (delete, archive, remove), apply the action immediately and show an undo toast with a countdown window. Users click through confirmation dialogs mindlessly; undo provides real safety by making the action instantly reversible while preserving interaction flow."
