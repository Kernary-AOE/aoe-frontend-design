id: "@community/anti-pattern-breaking-keyboard-flow"
kind: anti-pattern
version: "1.0.0"
description: "Re-implementing a `<button>`, `<a>`, `<input>`, or `<select>` as a custom `<div>` for styling reasons, without restoring the native keyboard semantics. The `<div onClick>` is unreachable by Tab, doesn't activate on Enter or Space, doesn't have a role, and isn't announced as interactive by screen readers. Tab order silently skips the entire control."
