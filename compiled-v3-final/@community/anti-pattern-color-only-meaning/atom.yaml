id: "@community/anti-pattern-color-only-meaning"
kind: anti-pattern
version: "1.0.0"
description: "Communicating state — error vs success vs warning, valid vs invalid, online vs offline, required vs optional — through color alone, with no icon, label, or text differentiation. Red 'Error' input borders, green 'Success' chip backgrounds, yellow 'Warning' rows. Users with color blindness (~8% of men), low vision, or in dark mode (where the saturation flattens) cannot distinguish the states."
