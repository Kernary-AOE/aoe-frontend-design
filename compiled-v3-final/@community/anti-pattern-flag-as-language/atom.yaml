id: "@community/anti-pattern-flag-as-language"
kind: anti-pattern
version: "1.0.0"
description: "Using a national flag icon to represent a language in a language switcher. Flags signify nation-states, not languages — the mapping from flag to language is many-to-many, often contested, and can offend or confuse users whose language is not tied to a single country."
