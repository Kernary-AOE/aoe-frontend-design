id: "@community/anti-pattern-leaky-target"
kind: anti-pattern
version: "1.0.0"
description: "A feature that is computed using information that would not have been available at inference time — typically because the feature pipeline reads the latest value of some column instead of the value as-of the prediction timestamp. Models with leaky features look spectacular in offline evaluation and fail completely in production."
