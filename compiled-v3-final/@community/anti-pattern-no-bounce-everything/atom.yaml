id: "@community/anti-pattern-no-bounce-everything"
kind: anti-pattern
version: "1.0.0"
description: "Applying spring overshoot or bounce easing (cubic-bezier Y > 1, e.g. cubic-bezier(0.34,1.56,0.64,1)) to all interactive elements — including modals, dropdowns, and form inputs — makes UI feel toy-like and adds 100-200ms of perceived latency."
