id: "@community/anti-pattern-no-loading-state"
kind: anti-pattern
version: "1.0.0"
description: "Triggering an async fetch, mutation, or navigation without any visible feedback — no spinner, skeleton, optimistic update, or disabled button. The UI freezes from the user's perspective: they don't know if their click registered, if the network is slow, or if the action failed silently."
