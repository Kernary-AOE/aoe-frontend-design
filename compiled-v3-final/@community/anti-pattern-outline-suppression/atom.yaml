id: "@community/anti-pattern-outline-suppression"
kind: anti-pattern
version: "1.0.0"
description: "The practice of suppressing browser-default focus outlines globally via CSS resets (`* { outline: none }` or `a:focus { outline: 0 }`) without providing custom focus indicators. This remains one of the most common WCAG failures on the web despite being trivially detectable and fixable."
