id: "@community/anti-pattern-text-in-image"
kind: anti-pattern
version: "1.0.0"
description: "Rasterizing important headlines, CTAs, prices, or product names directly into a JPG/PNG hero image instead of marking them up as HTML text. The text cannot be selected, copied, translated, screen-readered, or scaled. On retina displays it looks blurry; on small viewports it doesn't reflow. SEO crawlers don't see it. The page's primary message is invisible to half the access methods on the web."
