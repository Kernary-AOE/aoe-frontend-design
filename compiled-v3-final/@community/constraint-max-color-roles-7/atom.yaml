id: "@community/constraint-max-color-roles-7"
kind: constraint
version: "1.0.0"
description: "A single product-level design system should expose at most 7 semantic color roles: bg, surface, border, text, text-muted, primary, accent. Additional roles (success/warning/danger/info) belong to a separate `status` namespace and don't count toward the 7."
