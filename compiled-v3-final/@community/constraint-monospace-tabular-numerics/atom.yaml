id: "@community/constraint-monospace-tabular-numerics"
kind: constraint
version: "1.0.0"
description: "Numeric data in tables, dashboards, financial UIs, and metric cards MUST use tabular-numeral rendering (`font-variant-numeric: tabular-nums`) — NOT a monospace typeface — unless the typeface is itself monospace for other semantic reasons (code, terminals). Monospace fonts are not required; `tnum` OpenType feature on a proportional font achieves column alignment without sacrificing aesthetics."
domain: frontend-design
content_hash: "sha256:09a5a6344cfa12127293f8da0afbb1f7eb31ddb2ff4bae5d4639710a3a1448cf"
