description: "font-weight 100, 200, and 300 are BANNED for body text (≤ 20px) and primary UI labels; font-weight 900 is BANNED for body text. Permitted body/label weights are 400 (regular), 500 (medium), and 600 (semibold). Weight 700 (bold) is permitted for headings only. Weight 800–900 is permitted for display/hero text only."
