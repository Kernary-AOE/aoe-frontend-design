id: "@community/counter-example-icon-button-24px"
kind: counter-example
version: "1.0.0"
description: "A modal close (×) button styled as a bare icon with no padding. The clickable area is 16×16 CSS pixels — well below the WCAG 2.2 AA 24×24 minimum and a third of the Apple/Material 44×44 recommendation. On a phone, the user taps three times before hitting it."
