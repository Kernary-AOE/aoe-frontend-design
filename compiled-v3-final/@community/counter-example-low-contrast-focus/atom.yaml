id: "@community/counter-example-low-contrast-focus"
kind: counter-example
version: "1.0.0"
description: "A button focus state that uses a 1px light-gray outline. Technically a focus indicator exists, but at 1.4:1 contrast it is invisible at normal viewing distance. Auditors checking 'is outline non-zero' pass it; humans tabbing through cannot see where focus is."
