id: "@community/counter-example-outline-none"
kind: counter-example
version: "1.0.0"
description: "A widespread CSS anti-practice of globally suppressing focus outlines in base stylesheets or CSS resets, usually added because designers disliked the browser's default blue focus ring appearing on mouse clicks. The typical form: `* { outline: none }`, `a:focus { outline: 0 }`, or `button:focus { outline: none }`."
