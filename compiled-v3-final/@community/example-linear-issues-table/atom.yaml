description: "Linear's primary issue list is a single-line-per-row table on a near-black canvas (#08090A). Each row shows: priority icon (4 bars), issue ID (e.g., LIN-1234) in #6E7178 monospace, title in white, status pill, assignee avatar, and due date. Row height is ~32px — extreme density that lets ~25 issues fit in a viewport."
