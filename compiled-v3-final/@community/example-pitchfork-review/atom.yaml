description: "Pitchfork album reviews are dominated by the 'score' — a massive 96px+ numeric rating (e.g., '8.7') displayed prominently next to the album cover. The cover art is shown at ~480px square. Below the score is the artist name in 36px sans, album title in 56px serif italic. The review body uses a 720px column with serif type, with 'Best New Music' getting a special red badge."
