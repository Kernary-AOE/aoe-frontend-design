id: "@community/example-radix-dialog"
kind: example
version: "1.0.0"
description: "Radix Dialog implements full WAI-ARIA modal-dialog semantics: opens with focus moving to the first focusable element (or the explicitly-marked initialFocus), traps Tab cycling within the dialog, restores focus to the trigger on close, and dismisses on Escape. Background scroll is locked via aria-hidden on siblings. Backdrop click closes by default (configurable)."
