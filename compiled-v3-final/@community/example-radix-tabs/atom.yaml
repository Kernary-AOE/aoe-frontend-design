id: "@community/example-radix-tabs"
kind: example
version: "1.0.0"
description: "Radix Tabs implements WAI-ARIA Authoring Practices for tabs: Tab/Shift+Tab moves focus into and out of the tablist; ArrowLeft/Right (or Up/Down with vertical orientation) moves focus between tabs WITHOUT activating; Space/Enter activates the focused tab. Optional 'activateOnFocus' prop switches to auto-activation. Underline indicator slides between tabs with framer-motion."
