description: "The shadcn dashboard template uses HSL CSS variables for theming with a 240-deg neutral palette. Layout: 240px sidebar with collapsible groups, a 56px top nav with team-switcher dropdown, and a main grid of 4 KPI cards above a 2-column area (chart left / recent-sales list right). Light mode is bg-background (HSL 0 0% 100%), dark mode flips to HSL 240 10% 3.9%."
