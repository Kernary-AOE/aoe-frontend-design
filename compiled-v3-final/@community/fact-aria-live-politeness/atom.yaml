id: "@community/fact-aria-live-politeness"
kind: fact
version: "1.0.0"
description: "aria-live='polite' waits for the screen reader to finish the current utterance before announcing a region update, while aria-live='assertive' interrupts immediately — use polite for status messages and assertive only for time-critical errors (ARIA 1.2 live region properties)."
