id: "@community/fact-bidi-direction"
kind: fact
version: "1.0.0"
description: "RTL (right-to-left) scripts — Arabic, Hebrew, Persian, Urdu, Yiddish, Aramaic — require bidirectional text rendering specified by the Unicode Bidirectional Algorithm (UAX #9). Layouts must mirror, but specific elements (numerals, code, logos, media controls) must NOT mirror."
