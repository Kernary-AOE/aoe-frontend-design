id: "@community/fact-component-anatomy-three-layers"
kind: fact
version: "1.0.0"
description: "Every UI component is structurally composed of three distinct layers: the container (layout, spacing, background), the content (label, icon, description), and the interaction affordances (tap targets, focus ring, hover state). Treating these as one undifferentiated unit causes component-level design and accessibility failures."
