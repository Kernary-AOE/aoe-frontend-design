id: "@community/fact-contrast-ratio-aa-vs-aaa"
kind: fact
version: "1.0.0"
description: "WCAG 2.2 specifies two contrast tiers: AA (4.5:1 normal text, 3:1 large) is the legal compliance floor; AAA (7:1 normal, 4.5:1 large) is the recommended target for sustained reading and reflects the publishing-industry contrast standard."
