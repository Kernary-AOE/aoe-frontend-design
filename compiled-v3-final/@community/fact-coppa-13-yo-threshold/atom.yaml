id: "@community/fact-coppa-13-yo-threshold"
kind: fact
version: "1.0.0"
description: "Under the US Children's Online Privacy Protection Act (COPPA, 15 U.S.C. §6501-6506) and its implementing FTC Rule, online services must obtain verifiable parental consent before knowingly collecting personal information from a child under 13. UK Age Appropriate Design Code applies up to 18; GDPR's age-of-consent for data processing is 16 (member states may lower to 13)."
