id: "@community/fact-evaluation-set-frozen"
kind: fact
version: "1.0.0"
description: "A model's holdout evaluation set must be frozen before model development begins and must never be examined, joined to, or used for any decision other than the final model-quality verdict. Repeated 'peeking' at the test set converts it from a generalization estimator into a training set with extra steps."
