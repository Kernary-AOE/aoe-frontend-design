id: "@community/fact-hover-feedback-latency"
kind: fact
version: "1.0.0"
description: "指针 hover / focus / tap 后视觉反馈必须在 100ms 内开始。超过 200ms 用户的认知开始怀疑'我点中了吗 / 服务器卡了吗'。100-200ms 是'勉强可接受'的灰色地带——产品级品质要求 < 100ms。"
