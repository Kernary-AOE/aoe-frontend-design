id: "@community/fact-http-method-semantics"
kind: fact
version: "1.0.0"
description: "RFC 9110 (HTTP Semantics, June 2022) defines normative properties for each HTTP method: SAFE (no side effects), IDEMPOTENT (multiple identical requests have the same effect as one), CACHEABLE (response may be cached). GET and HEAD are safe + idempotent + cacheable; PUT and DELETE are idempotent (not safe); POST is none of the above by default; PATCH is none."
