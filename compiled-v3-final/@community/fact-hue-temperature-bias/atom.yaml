version: "1.0.0"
description: "Hue carries learned + biological associations: warm hues (red-orange, 0–60° / 300–360°) are associated with urgency, energy, and warning; cool hues (cyan-blue, 180–240°) with calm, trust, and stability — biases empirically replicated across cultures with cultural variance."
