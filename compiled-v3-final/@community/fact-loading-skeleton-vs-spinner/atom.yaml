id: "@community/fact-loading-skeleton-vs-spinner"
kind: fact
version: "1.0.0"
description: "Skeleton loaders (content-shaped placeholders) outperform spinners on perceived performance because they preview the layout, set the user's expectation about what's loading, and avoid the 'time-passing' connotation of a spinning element."
