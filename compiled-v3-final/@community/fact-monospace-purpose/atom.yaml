id: "@community/fact-monospace-purpose"
kind: fact
version: "1.0.0"
description: "Monospace typefaces are designed for fixed-advance-width contexts (code, terminals, tabular numerics) where character alignment carries information. Using them as body type for prose is anti-pattern: they slow reading and signal a code aesthetic where none is intended."
