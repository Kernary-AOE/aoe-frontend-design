id: "@community/fact-oklch-perceptual-uniform"
kind: fact
version: "1.0.0"
description: "OKLCH is a perceptually-uniform color space: equal numerical changes in L (lightness) or C (chroma) produce equal perceived changes across all hues. sRGB hex / HSL fail this property — equal HSL lightness deltas read very differently across yellow vs blue."
