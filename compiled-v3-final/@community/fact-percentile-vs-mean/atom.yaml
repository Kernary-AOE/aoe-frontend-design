id: "@community/fact-percentile-vs-mean"
kind: fact
version: "1.0.0"
description: "Latency distributions in production systems are heavily right-skewed and multi-modal; the arithmetic mean hides tail behavior that high percentiles (p95, p99, p99.9) reveal. SLO targets must be defined on percentiles, never on the mean."
