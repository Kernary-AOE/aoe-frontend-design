id: "@community/fact-pii-tokenization"
kind: fact
version: "1.0.0"
description: "Personally identifiable information (PII) — SSN, full name, email, phone, payment card, government ID, biometric — must be replaced with non-reversible tokens at the system boundary; downstream systems operate exclusively on tokens. Real PII lives only in a hardened vault with strict access controls and an audit log."
