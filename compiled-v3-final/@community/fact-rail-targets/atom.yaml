description: "The Chrome RAIL performance model defines four user-centric performance budgets: Response (≤100ms), Animation (≤16.67ms per frame), Idle (yield ≤50ms), Load (interactive ≤5000ms on slow 4G). These targets reflect human perception thresholds and remain the canonical engineering goals for web performance."
