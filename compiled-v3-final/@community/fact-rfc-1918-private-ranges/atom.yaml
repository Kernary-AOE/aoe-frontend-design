id: "@community/fact-rfc-1918-private-ranges"
kind: fact
version: "1.0.0"
description: "RFC 1918 reserves three IPv4 ranges for private use: 10.0.0.0/8 (16,777,216 addresses), 172.16.0.0/12 (1,048,576 addresses), and 192.168.0.0/16 (65,536 addresses). These addresses are not routable on the public internet and are the canonical choice for VPC/internal networks."
