id: "@community/fact-tonal-palette-12-step"
kind: fact
version: "1.0.0"
description: "A 12-step tonal palette assigns each step a fixed functional role (steps 1–2: app backgrounds; 3–4: component backgrounds/hover; 5–6: borders/separators; 7–8: solid backgrounds; 9–10: high-contrast solids; 11–12: text), enabling automatic dark-mode parity and WCAG AA compliance when steps 9–10 are tested against steps 1–2."
