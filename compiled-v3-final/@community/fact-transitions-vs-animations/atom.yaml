id: "@community/fact-transitions-vs-animations"
kind: fact
version: "1.0.0"
description: "CSS transitions (property-triggered, auto-reversible) and CSS animations (@keyframes, scripted sequence) serve different purposes — transitions for state-toggled UI feedback, animations for entrances/exits/loading — mixing them incorrectly creates brittle, non-reversing motion."
