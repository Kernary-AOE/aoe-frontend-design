id: "@community/metric-cls-cumulative-layout-shift"
kind: metric
version: "1.0.0"
description: "CLS is one of Google's three Core Web Vitals (alongside LCP and INP). It measures the visual stability of a page by summing the impact-fraction × distance-fraction of every unexpected layout shift during the page's lifetime. A 'shift' is any visible element that moves position between two rendered frames without the user initiating it. High CLS makes pages feel unstable and causes mis-clicks (e.g. user taps an ad that just appeared where a button was)."
domain: frontend-engineering
content_hash: "sha256:0c3ca1319f5e220891d28d3916c420c0072bbf186b76276b524658f9e62bbc6f"
