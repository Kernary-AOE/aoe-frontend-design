id: "@community/metric-lcp-largest-contentful-paint"
kind: metric
version: "1.0.0"
description: "LCP is one of Google's three Core Web Vitals — it measures the render time of the largest image, video poster, or text block visible within the viewport during initial page load. LCP is a perception metric: it approximates 'when does the page feel loaded?' from the user's point of view. Optimizing LCP almost always improves user-reported satisfaction and conversion."
