id: "@community/pattern-table-of-contents-sticky"
kind: pattern
version: "1.0.0"
description: "A right-rail (or left-rail) navigation listing the article's H2/H3 headings, sticking to the viewport during scroll. Highlights the currently visible section using IntersectionObserver and supports smooth scroll-to-anchor on click."
domain: frontend-design
content_hash: "sha256:6c4afc88d12b4c98ffc6d3275f3306a73326a10502fab57339b052ddf33523f2"
tokens:
  summary: 74
  core: 695
  full: 1365
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/pattern-blog-article-layout" }
  - { type: related, target: "@community/check-focus-visible" }
  - { type: related, target: "@community/constraint-reduced-motion" }
  - { type: related, target: "@community/check-heading-hierarchy" }
  - { type: related, target: "@community/check-line-length-optimal" }
  - { type: related, target: "@community/check-skip-link" }
  - { type: compatible, target: "@community/pattern-blog-article-layout" }
  - { type: compatible, target: "@community/pattern-breadcrumb-trail" }
