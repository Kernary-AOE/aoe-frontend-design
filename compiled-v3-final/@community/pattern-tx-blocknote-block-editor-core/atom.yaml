id: "@community/pattern-tx-blocknote-block-editor-core"
kind: pattern
version: "1.0.0"
description: "Notion-style block editor composition using BlockNote v0.x (MPL-2.0): a single BlockNoteDefaultUI renders up to eight opt-in floating UIs (FormattingToolbarController, SuggestionMenuController for '/', GridSuggestionMenuController for ':', SideMenuController, FilePanelController, TableHandlesController, FloatingComposerController, FloatingThreadController) gated by feature detection via editor.getExtension()."
domain: frontend-design
content_hash: "sha256:7b8cb5ca33f5e70016a634ff5d97027dc4e4ebae0d68bfb13293e28419d8cf22"
tokens:
  summary: 121
  core: 649
  full: 1234
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/pattern-tx-blocknote-drag-handle" }
  - { type: related, target: "@community/pattern-tx-blocknote-nested-indent" }
  - { type: related, target: "@community/template-liveblocks-selection-presence" }
  - { type: related, target: "@community/rule-keyboard-tab-order" }
  - { type: related, target: "@community/check-focus-visible" }
  - { type: related, target: "@community/rule-aria-label-in-name" }
