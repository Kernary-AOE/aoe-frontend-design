id: "@community/pattern-tx-blocknote-nested-indent"
kind: pattern
version: "1.0.0"
description: "BlockNote smart-Enter keyboard handler for nested list items: when a bulletListItem, numberedListItem, checkListItem, or toggleListItem is empty and Enter is pressed, convert the block back to a paragraph (exit the list) rather than creating another empty bullet. Uses Tiptap commands.first() with priority ordering."
