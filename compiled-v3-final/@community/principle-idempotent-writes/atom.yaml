id: "@community/principle-idempotent-writes"
kind: principle
version: "1.0.0"
description: "Every write to a downstream system (database, queue, API, blob store) must be safely retryable: re-applying the same operation N times must produce exactly the same observable state as applying it once. In distributed systems, retries are inevitable — at-least-once delivery is the default."
