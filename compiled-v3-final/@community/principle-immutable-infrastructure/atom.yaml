id: "@community/principle-immutable-infrastructure"
kind: principle
version: "1.0.0"
description: "Servers, containers, and VMs in production must be replaced rather than modified. To change configuration, deploy code, or apply a security patch, build a new artifact (AMI, container image, machine image), boot a new instance from it, shift traffic, then terminate the old instance."
