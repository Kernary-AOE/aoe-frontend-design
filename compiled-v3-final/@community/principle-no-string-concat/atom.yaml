id: "@community/principle-no-string-concat"
kind: principle
version: "1.0.0"
description: "Translatable strings must never be assembled by concatenation in code. Word order, plural forms, gender agreement, and grammatical case differ across languages — concatenation hardcodes English grammar and produces broken translations in 6500+ other locales."
