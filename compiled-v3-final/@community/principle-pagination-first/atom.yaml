id: "@community/principle-pagination-first"
kind: principle
version: "1.0.0"
description: "Every list endpoint must paginate from day one. Adding pagination to an unbounded endpoint after launch is a breaking change that requires every client to update; defaulting to a hard cap (e.g. 50 items) future-proofs the API at zero cost on day one."
