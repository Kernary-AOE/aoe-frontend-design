id: "@community/principle-perceived-vs-actual"
kind: principle
version: "1.0.0"
description: "Perceived performance — what the user feels — diverges from instrumented performance metrics in predictable ways. Optimize for the perceived experience: progressive rendering, optimistic UI, skeleton states, and immediate acknowledgment of input matter more than the wall-clock total. A 200ms response with a 50ms acknowledgment feels faster than a 100ms response that waits for the whole result."
domain: performance
