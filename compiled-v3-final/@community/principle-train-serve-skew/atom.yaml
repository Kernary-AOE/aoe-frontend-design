id: "@community/principle-train-serve-skew"
kind: principle
version: "1.0.0"
description: "Features used at inference time must be computed by exactly the same code, against exactly the same data sources, as features used at training time. Any divergence — different code path, different SQL, different rounding, different null handling — produces train-serve skew, the #1 cause of silent ML production failures."
