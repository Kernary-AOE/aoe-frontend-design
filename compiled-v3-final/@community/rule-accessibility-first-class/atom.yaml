id: "@community/rule-accessibility-first-class"
kind: rule
version: "1.0.0"
description: "Accessibility must be treated as a core product requirement from the design phase onward — not a post-launch audit — because retrofitting WCAG AA compliance after launch costs 10–100× more than building it in, and inaccessible products exclude users and create legal liability."
