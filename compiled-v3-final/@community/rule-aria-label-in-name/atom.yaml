id: "@community/rule-aria-label-in-name"
kind: rule
version: "1.0.0"
description: "When an interactive element has visible text, its accessible name computed by aria-label or aria-labelledby must include that visible text as a substring, so voice-control users can activate it by speaking what they see (WCAG SC 2.5.3 Label in Name, Level A)."
