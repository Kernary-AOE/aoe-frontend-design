id: "@community/rule-aria-label-required"
kind: rule
version: "1.0.0"
description: "Interactive elements that present no visible accessible name (icon-only buttons, icon-only links, image-only buttons) MUST carry a non-empty `aria-label` (or `aria-labelledby`, or visually-hidden text). Without an accessible name, screen-reader users hear 'button' with no context."
domain: accessibility
content_hash: "sha256:6e894628d581dca5f77d4274a88786568bb2b950aceef2c58092d13783b2b85a"
