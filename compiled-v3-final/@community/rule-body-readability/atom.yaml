id: "@community/rule-body-readability"
kind: rule
version: "1.0.0"
description: "Body text MUST meet the minimum readability floor: `font-size` ≥ 16px (1rem) and `line-height` ≥ 1.5 (unitless). Text below 16px causes user-pinch-zoom on mobile; line-height under 1.5 collapses descenders into ascenders and reduces sustained-reading speed."
domain: typography
