id: "@community/rule-cls-budget"
kind: rule
version: "1.0.0"
description: "Every page must enforce a Cumulative Layout Shift (CLS) budget of ≤ 0.1 (Google's 'Good' threshold). CI fails the build when synthetic measurement crosses the threshold; production RUM rolling-p75 above 0.1 triggers an alert."
domain: performance
content_hash: "sha256:11b5eb4f4230604f5bdbee5571f9a1cdfae66523fe0204dce1fea4bf71f78f59"
tokens:
  summary: 224
  core: 598
  full: 1212
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/metric-cls-cumulative-layout-shift" }
  - { type: related, target: "@community/principle-perceived-vs-actual" }
  - { type: related, target: "@community/pattern-image-lcp-priority" }
  - { type: related, target: "@community/anti-pattern-blocking-third-party" }
  - { type: related, target: "@community/fact-rail-targets" }
  - { type: enhances, target: "@community/metric-cls-cumulative-layout-shift" }
created_at: "2026-05-07"
