id: "@community/rule-color-dark-mode-cascade"
kind: rule
version: "1.0.0"
description: "Dark mode MUST be implemented via a CSS-cascade strategy keyed on `@media (prefers-color-scheme: dark)` or a single root-level `[data-theme='dark']` selector that flips token values. Hand-edited per-component dark colors, JS-driven inline-style toggling, and duplicated 'dark' class variants are forbidden."
domain: visual-design
