id: "@community/rule-content-width-constrained"
kind: rule
version: "1.0.0"
description: "Long-form content containers (article, blog post, documentation, prose) MUST cap their width at approximately 65ch (≈ 720px at 16px/1ch). Full-bleed layouts force readers to track lines wider than the eye can follow, increasing fatigue and abandonment."
domain: typography
content_hash: "sha256:be0645d797f9fec4cad8d703fc3b269c0129b5f9a15dddc12c3276736c59555a"
tokens:
  summary: 78
  core: 426
  full: 788
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/rule-line-length-optimal" }
  - { type: related, target: "@community/rule-body-readability" }
  - { type: related, target: "@community/fact-optimal-line-length" }
  - { type: see-also, target: "@community/check-content-width-constrained" }
  - { type: validates-with, target: "@community/fact-optimal-line-length" }
created_at: "2026-05-07"
