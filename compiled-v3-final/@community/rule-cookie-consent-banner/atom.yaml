id: "@community/rule-cookie-consent-banner"
kind: rule
version: "1.0.0"
description: "In the EU/EEA/UK, non-essential cookies and similar tracking technologies (pixels, fingerprinting, localStorage analytics) require freely-given, specific, informed, and unambiguous prior consent before the cookie is set. Pre-checked boxes, implied consent, and 'continue browsing = consent' are illegal under the ePrivacy Directive and GDPR."
