id: "@community/rule-cross-platform-a11y-parity"
kind: rule
version: "1.0.0"
description: "Each platform must implement the accessibility conventions native to that platform — touch targets ≥ 44×44pt on iOS/Android and full keyboard navigation on desktop — because ignoring platform-specific assistive-technology conventions excludes users with disabilities."
