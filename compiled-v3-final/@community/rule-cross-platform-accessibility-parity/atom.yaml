id: "@community/rule-cross-platform-accessibility-parity"
kind: rule
version: "1.0.0"
description: "Each platform must implement the accessibility conventions native to that platform — web requires ARIA and keyboard navigation, iOS requires Dynamic Type and VoiceOver labels, Android requires TalkBack support — and accessibility features must not be silently absent on one platform."
