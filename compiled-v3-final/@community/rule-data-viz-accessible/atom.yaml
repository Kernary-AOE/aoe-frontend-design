id: "@community/rule-data-viz-accessible"
kind: rule
version: "1.0.0"
description: "SVG and canvas charts must expose a descriptive aria-label on role='img' that states the data trend, never rely on color as the sole encoding channel, provide a screen-reader text alternative (sr-only table or summary), and respect prefers-reduced-motion by disabling chart entry animations (WCAG SC 1.1.1 Non-text Content, SC 1.4.1 Use of Color)."
domain: frontend-design
content_hash: "sha256:1bb1e090588e6b2e778df5b1271731684e4db583b3bd058e949c62b476b769b6"
tokens:
  summary: 102
  core: 507
  full: 995
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/template-svg-chart-aria" }
  - { type: related, target: "@community/constraint-reduced-motion" }
  - { type: related, target: "@community/anti-pattern-color-only-meaning" }
  - { type: related, target: "@community/counter-example-status-color-only" }
  - { type: related, target: "@community/example-accessible-chart" }
  - { type: related, target: "@community/example-vercel-analytics" }
  - { type: related, target: "@community/rule-color-contrast" }
