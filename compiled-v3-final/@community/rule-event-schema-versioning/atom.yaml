id: "@community/rule-event-schema-versioning"
kind: rule
version: "1.0.0"
description: "Every event published to a stream (Kafka topic, Pulsar topic, Kinesis stream) must carry an explicit schema identifier and version. Consumers must reject events whose schema is unknown rather than fall back to best-effort parsing."
