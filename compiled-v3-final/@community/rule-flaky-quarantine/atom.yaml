id: "@community/rule-flaky-quarantine"
kind: rule
version: "1.0.0"
description: "A test that fails non-deterministically (passes on retry without code change) MUST be quarantined within 24 hours: removed from the gating CI suite, tagged @flaky, and assigned an owner with a deadline. Flakes left in the gating suite destroy trust in CI; ignoring them trains engineers to retry mindlessly."
domain: testing
content_hash: "sha256:efca4a6ba31352030c6dfcc80eb870cff3a135bb7a6f9823e7ccf181e61d0f90"
tokens:
  summary: 263
  core: 644
  full: 1336
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
