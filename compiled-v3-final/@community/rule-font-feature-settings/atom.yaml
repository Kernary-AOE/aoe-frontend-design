id: "@community/rule-font-feature-settings"
kind: rule
version: "1.0.0"
description: "Display and body fonts MUST enable OpenType features at the CSS level: at minimum `font-feature-settings: 'kern' 1, 'liga' 1` globally; fintech/data UIs MUST add `'tnum' 1, 'lnum' 1`; brand or editorial contexts SHOULD add stylistic sets `'ss01' 1` or character variants `'cv01' 1` where the typeface ships them."
