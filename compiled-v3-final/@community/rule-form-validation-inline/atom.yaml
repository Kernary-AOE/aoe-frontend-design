  - { type: related, target: "@community/anti-pattern-clear-form-on-failure" }
  - { type: related, target: "@community/example-stripe-checkout" }
  - { type: related, target: "@community/example-calcom-scheduler" }
  - { type: related, target: "@community/principle-error-prevention-and-recovery" }
