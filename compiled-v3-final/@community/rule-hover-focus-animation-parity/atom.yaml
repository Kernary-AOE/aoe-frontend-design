id: "@community/rule-hover-focus-animation-parity"
kind: rule
version: "1.0.0"
description: "When a card lifts 4px on :hover, keyboard-focused cards must also lift 4px. When a button darkens and scales on :hover, the same must happen on :focus-visible. The focus-visible outline or ring is required but is NOT a substitute for the hover motion — it is additive. Motion feedback communicates 'this element is interactive and responding to your attention.'"
domain: frontend-design
