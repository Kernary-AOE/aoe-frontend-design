id: "@community/rule-image-lazy-loading"
kind: rule
version: "1.0.0"
description: "Images that are not visible in the initial viewport MUST use loading='lazy' to defer their network fetch; above-the-fold images MUST use loading='eager' (the default) and should use fetchpriority='high' for the LCP image."
domain: frontend-design
content_hash: "sha256:f3b370a1a390de942dee6bdc380ebceb1a60600dabf64d96f697c33c4c79de10"
tokens:
  summary: 70
  core: 102
  full: 261
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/rule-image-optimization" }
  - { type: related, target: "@community/rule-image-explicit-dimensions" }
  - { type: related, target: "@community/fact-doherty-threshold" }
created_at: "2026-05-07"
