id: "@community/rule-keyboard-tab-order"
kind: rule
version: "1.0.0"
description: "Every interactive element must be reachable via Tab key in a sequence that matches the visual reading order — left-to-right, top-to-bottom — so keyboard-only users can navigate without disorientation (WCAG SC 2.4.3 Focus Order, Level A)."
