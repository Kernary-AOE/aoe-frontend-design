id: "@community/rule-landmark-elements"
kind: rule
version: "1.0.0"
description: "Major page regions MUST be wrapped in HTML landmark elements — <header>, <nav>, <main>, <aside>, <footer>, <section aria-labelledby>, <form aria-label> — so screen reader users can jump directly to any region."
