id: "@community/rule-line-length-optimal"
kind: rule
version: "1.0.0"
description: "Body text containers (paragraphs, list items, block quotes) MUST limit measure (line length) to between 45 and 75 characters per line. This range is the documented optimum for sustained reading — below 45ch the eye breaks rhythm, above 75ch it loses the next-line return."
domain: typography
content_hash: "sha256:0d310b7f2d809d26e9971765dfc2a3ee322e71b71302b7888734ef83bb8bb967"
tokens:
