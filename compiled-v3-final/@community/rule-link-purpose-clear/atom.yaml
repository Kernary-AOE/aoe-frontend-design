  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/rule-aria-label-required" }
  - { type: related, target: "@community/rule-heading-hierarchy" }
  - { type: related, target: "@w3c/source-wcag-22" }
  - { type: see-also, target: "@community/check-link-purpose-clear" }
  - { type: validates-with, target: "@w3c/source-wcag-22" }
created_at: "2026-05-07"
