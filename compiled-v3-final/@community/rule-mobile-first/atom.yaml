id: "@community/rule-mobile-first"
kind: rule
version: "1.0.0"
description: "CSS responsive breakpoints MUST be authored mobile-first: base styles target the smallest viewport, and `@media (min-width: ...)` queries layer on enhancements for larger viewports. Desktop-first authoring (`@media (max-width: ...)`) requires the cascade to override styles repeatedly and tends to bloat mobile payloads."
domain: frontend-engineering
content_hash: "sha256:718c71ed6a5c8d1a0c2dc5101b3dd3a8ef1d974be42556fc325e3fbc82736b87"
tokens:
  summary: 95
  core: 410
  full: 740
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
