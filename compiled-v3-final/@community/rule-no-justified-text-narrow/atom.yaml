id: "@community/rule-no-justified-text-narrow"
kind: rule
version: "1.0.0"
description: "CSS `text-align: justify` is BANNED on any text container narrower than 45ch or on any mobile viewport without CSS hyphenation enabled (`hyphens: auto`); it produces uneven word-spacing rivers that destroy reading rhythm on short line lengths."
domain: frontend-design
