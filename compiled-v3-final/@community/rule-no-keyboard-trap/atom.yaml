id: "@community/rule-no-keyboard-trap"
kind: rule
version: "1.0.0"
description: "Users must always be able to move keyboard focus out of any component using standard keys (Tab, Shift+Tab, or Escape); trapping focus in a non-modal context makes the interface completely unusable for keyboard-only and assistive technology users (WCAG SC 2.1.2 No Keyboard Trap, Level A)."
