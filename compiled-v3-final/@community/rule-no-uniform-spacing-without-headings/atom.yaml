id: "@community/rule-no-uniform-spacing-without-headings"
kind: rule
version: "1.0.0"
description: "Unrelated content blocks must not use identical spacing between them when no heading or visual separator distinguishes their boundaries — spacing variation is itself a structural signal, and uniform spacing creates an undifferentiated wall of content."
domain: frontend-design
content_hash: "sha256:8fa494808e4531f7fb07a27d672afac9b64e4123af4b37c6d0bd985804fb7ac3"
tokens:
  summary: 81
  core: 205
  full: 384
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/rule-spacing-rhythm" }
  - { type: related, target: "@community/rule-heading-hierarchy-logical" }
  - { type: related, target: "@community/check-spacing-rhythm" }
created_at: "2026-05-07"
