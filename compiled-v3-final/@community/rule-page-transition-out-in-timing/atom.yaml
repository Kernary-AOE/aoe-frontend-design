id: "@community/rule-page-transition-out-in-timing"
kind: rule
version: "1.0.0"
description: "Exit is intentional — the user chose to leave. The animation should confirm the decision quickly (150ms) with an accelerating curve (ease-in) that reads as 'departing'. Entrance is discovery — the user is absorbing new content. It should decelerate into position (ease-out, 300ms) giving the eye time to orient. Symmetric timing (same duration for both) feels indecisive and makes the total transition 100ms longer than necessary."
domain: frontend-design
content_hash: "sha256:d24b9eaab7e92a95a21c77629d57ec2e03cdfa3ae6b3b206c0441cd402cdd82f"
tokens:
  summary: 192
  core: 557
  full: 999
