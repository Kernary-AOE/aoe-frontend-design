tokens:
  summary: 166
  core: 245
  full: 536
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/anti-pattern-magic-numbers" }
  - { type: related, target: "@community/fact-design-token-cascade" }
  - { type: related, target: "@community/rule-consistent-design-token-scale" }
created_at: "2026-05-07"
