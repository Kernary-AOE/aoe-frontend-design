id: "@community/rule-reduced-motion-required"
kind: rule
version: "1.0.0"
description: "Every CSS animation, CSS transition, and JS-driven motion MUST respect the user's `prefers-reduced-motion: reduce` setting. Vestibular disorders, migraine triggers, and motion sensitivity make animation actively harmful for some users — opt-out is mandatory, not optional."
domain: accessibility
