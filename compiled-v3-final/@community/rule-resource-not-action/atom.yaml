id: "@community/rule-resource-not-action"
kind: rule
version: "1.0.0"
description: "REST URLs MUST identify resources, not actions. Use nouns for paths and HTTP verbs for operations. URLs containing verbs (`/createUser`, `/getOrders`, `/deleteCart`) violate REST and produce inconsistent, ambiguous APIs."
domain: api-design
