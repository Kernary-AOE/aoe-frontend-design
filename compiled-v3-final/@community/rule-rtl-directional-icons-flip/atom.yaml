id: "@community/rule-rtl-directional-icons-flip"
kind: rule
version: "1.0.0"
description: "In RTL layouts, icons that imply directionality (arrows, chevrons, forward/back cues) must be horizontally mirrored via transform: scaleX(-1); icons with no directional meaning (star, heart, warning triangle) must not be flipped."
