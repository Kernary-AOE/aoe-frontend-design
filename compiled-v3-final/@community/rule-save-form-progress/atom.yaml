  core: 311
  full: 544
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/rule-preserve-user-input-on-error" }
  - { type: related, target: "@community/pattern-multi-step-wizard" }
  - { type: related, target: "@community/rule-form-validation-inline" }
