id: "@community/rule-save-form-progress"
kind: rule
version: "1.0.0"
description: "Long or high-stakes forms (multi-step wizards, job applications, checkout with many fields) should auto-save draft progress to localStorage or a backend draft endpoint so users can resume after accidental navigation, session expiry, or browser crash."
domain: frontend-design
content_hash: "sha256:4acc6f4c876a69eca738e841ef530af6f4b24952dfef35b9d4259183f2b8d87e"
tokens:
