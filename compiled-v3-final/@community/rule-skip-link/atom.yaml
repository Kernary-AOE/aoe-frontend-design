id: "@community/rule-skip-link"
kind: rule
version: "1.0.0"
description: "Documents with repeated header / navigation chrome MUST provide a 'skip to main content' link as the first focusable element. WCAG 2.2 SC 2.4.1 (Bypass Blocks) requires a mechanism for keyboard users to skip past blocks of content that repeat across pages."
domain: accessibility
content_hash: "sha256:349f3d5b93209f49f8c28670123d713c0deafc18e6d05277b4f370e5784428f3"
tokens:
  summary: 76
  core: 415
  full: 764
projection:
  summary: "chunks/summary.md"
  core: "chunks/core.md"
  full: "chunks/full.md"
quality:
  overall: 4
relations:
  - { type: related, target: "@community/rule-keyboard-accessible" }
  - { type: related, target: "@community/rule-focus-visible" }
  - { type: related, target: "@w3c/source-wcag-22" }
  - { type: related, target: "@community/anti-pattern-breaking-keyboard-flow" }
  - { type: related, target: "@community/example-catalyst-app" }
  - { type: related, target: "@community/rule-landmark-elements" }
  - { type: see-also, target: "@community/check-skip-link" }
  - { type: validates-with, target: "@w3c/source-wcag-22" }
created_at: "2026-05-07"
