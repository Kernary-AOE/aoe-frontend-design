id: "@community/rule-slo-required-for-prod"
kind: rule
version: "1.0.0"
description: "Every user-facing service in production must publish at least one Service Level Objective (SLO) — a numeric target (99.9% / 99.95% / 99.99%) for a specific Service Level Indicator (SLI) measured over a rolling window (typically 28 or 30 days). No SLO = no production launch."
