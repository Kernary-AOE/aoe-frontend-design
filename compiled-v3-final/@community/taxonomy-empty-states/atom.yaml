id: "@community/taxonomy-empty-states"
kind: taxonomy
version: "1.0.0"
description: "A taxonomy of empty states by their underlying cause. Each cause requires distinct UX: 'no data yet' invites action; 'cleared' celebrates progress; 'error' explains failure; 'filtered to nothing' offers escape. Treating all empty states identically (one generic illustration + 'Nothing here yet') misses the chance to guide the user."
domain: ux-design
content_hash: "sha256:3620f82f39ca8c69e2555122b523fe75c405775aeabd7c30b3c2947a46550d97"
tokens:
