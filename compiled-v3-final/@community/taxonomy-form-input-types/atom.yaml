id: "@community/taxonomy-form-input-types"
kind: taxonomy
version: "1.0.0"
description: "A taxonomy of HTML form input controls and their semantic types. The HTML5 specification defines 22 input `type` values plus several distinct elements (textarea, select, button). Choosing the correct type unlocks browser-native validation, mobile keyboard optimization, autocomplete behavior, and accessibility affordances — using the wrong type (e.g. `type='text'` for an email) is a common, silent accessibility regression."
