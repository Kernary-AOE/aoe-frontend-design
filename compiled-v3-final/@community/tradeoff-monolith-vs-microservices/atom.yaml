id: "@community/tradeoff-monolith-vs-microservices"
kind: tradeoff
version: "1.0.0"
description: "Choosing between a single deployable monolith and a fleet of independently-deployed microservices. Microservices are oversold for early-stage products; monoliths are undersold for mature ones. The right answer depends on team size, deployment cadence, and bounded-context maturity — not on what's fashionable."
