description: "Choosing where rendering happens shapes performance, SEO, complexity, and developer experience. SSR streams HTML on every request, SSG pre-renders at build time, and CSR ships a JS bundle that hydrates a shell. There is no globally correct answer — the choice depends on content freshness, traffic shape, and the team's operational maturity."
