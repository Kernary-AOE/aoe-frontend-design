# The §4.3 declaration (`../prime-corpus.yaml`) names the source sets this corpus
# ALREADY carries. This file is the other half: the standing decision for every
# legacy unit the corpus does NOT carry, so that nothing is dropped silently.
#
# Scope: the 2734 legacy units the three-way reconciliation
# (`docs/analysis/corpus-reconciliation/`) could not map to any bundle unit.
# Row-level detail, all 2734 of them: `intake/legacy-unmapped-triage.csv`.
# Rejections and their reasons: `REJECTED.md`.
#
# Every disposition below is a pure function of (tree, namespace, source.license,
# content cosine to the nearest bundle unit). Regenerate with
# `docs/analysis/corpus-reconciliation/tools/disposition.py`; do not hand-edit.

