# ---------------------------------------------------------------------------
# Bundle side: 698 shipped units with no legacy ancestor. Profiled in the same
# verdict document; row detail in `intake/bundle-only-triage.csv`.
#
# This half is not an intake question — those units are already published. It is
# a provenance-accuracy question, and the ledger records one finding the corpus
# declaration currently contradicts.
# ---------------------------------------------------------------------------
bundleOnly:
  total: 698
  byNamespace: {@community: 635, @impeccable: 35, @anthropic-impeccable: 23, @w3c: 3, @nielsen: 2}
  provenance:
    - verdict: NO-UPSTREAM-CLAIMED
      units: 672
    - verdict: UNDECLARED-UPSTREAM-NO-LICENCE
      units: 14
    - verdict: UNDECLARED-UPSTREAM-LICENCE
      units: 10
    - verdict: DECLARED
      units: 2
  finding: >-
    12 units under @community name GPL-3.0 and the repository
    github.com/spencergoldade/cursor-designer inside their own `notes:` text while
    declaring no `license:` field, so ../prime-corpus.yaml sorts them into the
    `community-original` set — the set whose `origin` states that no upstream work
    is redistributed and whose licence is Apache-2.0. GPL-3.0 is on that same
    file's `license.policy.deny`. The gate did not fire because the licence was
    dropped during the id-convention rewrite rather than carried into the unit.
    Ids and evidence: RECONCILIATION-CORRECTIONS is not the place for this; see
    REJECTED.md section 3.
