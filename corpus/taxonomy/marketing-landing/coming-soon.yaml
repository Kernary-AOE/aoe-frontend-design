task_type: coming-soon
parent: marketing-landing
description: "Pre-launch teaser page with countdown, email capture, and brand-building anticipation."
trigger_keywords:
  - "coming soon"
  - "pre-launch"
  - "teaser"
  - "countdown"
  - "即将上线"
  - "敬请期待"
  - "launching soon"
  - "waitlist teaser"
  - "stealth mode"
default_register_pool:
  - school: warm-institutional
    weight: 0.4
  - school: magazine-editorial
    weight: 0.35
  - school: framer
    weight: 0.25
required_atoms:
  - "@community/pattern-hero-with-demo"
  - "@community/pattern-trust-signal-components"
  - "@community/rule-single-primary-action-per-screen"
  - "@community/principle-commit-bold-aesthetic"
recommended_motion:
  - "@community/pattern-page-load-choreography"
  - "@community/pattern-fade-in-on-load"
  - "@community/template-animated-mesh-background"
forbidden_atoms:
  - "@impeccable/persona-dense-pragmatist"
  - "@community/pattern-dashboard-layout"
  - "@community/pattern-data-table-dense"
quality_checks:
  - "Email capture must be the single primary action above the fold"
  - "Brand identity must be established even with minimal content"
  - "Countdown timer (if present) must use accessible aria-live regions"
  - "Page must communicate what is coming without revealing too much"
  - "Visual atmosphere must build anticipation and desire"
  - "Background must not be plain white — atmospheric treatment preferred"
