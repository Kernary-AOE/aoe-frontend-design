task_type: log-viewer
parent: product-ui
description: "Developer log viewer with search, filtering by log level, dense monospace display, and real-time streaming."
trigger_keywords:
  - "log viewer"
  - "logs"
  - "日志查看器"
  - "日志"
  - "可过滤"
  - "Bloomberg那种密度"
  - "server logs"
  - "error logs"
  - "log stream"
  - "debug logs"
default_register_pool:
  - school: dense-pragmatist
    weight: 0.5
  - school: linear
    weight: 0.3
  - school: warp
    weight: 0.2
required_atoms:
  - "@community/pattern-log-viewer-virtualized"
  - "@community/pattern-virtual-list-rendering"
  - "@community/pattern-data-table-dense"
  - "@community/fact-monospace-purpose"
  - "@community/constraint-monospace-tabular-numerics"
  - "@community/pattern-interaction-states"
recommended_motion:
  - "@community/pattern-motion-loading"
  - "@community/pattern-skeleton-shimmer"
forbidden_atoms:
  - "@impeccable/persona-warm-institutional"
  - "@impeccable/persona-magazine-editorial"
  - "@community/template-animated-mesh-background"
  - "@community/pattern-gradient-mesh-engine"
max_atoms_per_axis:
  register: 1
  pattern: 3
  motion: 1
  typography: 2
  color: 1
  rules: 3
quality_checks:
  - "Log entries must use monospace font for alignment (JetBrains Mono / IBM Plex Mono / SF Mono / Geist Mono)"
  - "Log levels (ERROR, WARN, INFO, DEBUG, FATAL) must be color-coded with CSS classes (not just JS-tagged data)"
  - "DENSITY MANDATE: line-height MUST be 1.30-1.35 (NOT 1.45+); row vertical padding 2-4px max — Bloomberg-tight"
  - "Base font size 11-13px (no larger — readability comes from monospace + tight tracking, not size)"
  - "At least 60 sample log rows with realistic real-looking severity-distributed data"
  - "Search must filter in real-time with highlighted matches"
  - "Virtual scrolling must handle 10,000+ log lines without jank"
  - "Timestamps must be displayed in user's local timezone"
  - "Copy to clipboard must work on individual log lines"
  - "Keyboard shortcut (/) must focus search input"
  - "Filter UI: at least 3 controls (level chips + service dropdown + time-range + text search)"
