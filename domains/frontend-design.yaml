name: frontend-design
version: "1.0.0"
description: Domain plugin for the frontend design corpus. Covers visual design, UI patterns, UX principles, layout, typography, color, motion, forms, navigation, accessibility, and design systems.

tags:
  - a11y
  - accessibility
  - aria
  - color
  - contrast
  - design-systems
  - focus
  - forms
  - i18n
  - keyboard
  - layout
  - modal
  - motion
  - navigation
  - responsive
  - spacing
  - typography
  - ui
  - ux
  - wcag

axes:
  - name: visual-layer
    description: Which visual layer of the UI this atom primarily addresses.
    matches:
      - color
      - typography
      - spacing
      - layout
      - motion
      - animation
      - shadow
      - border

  - name: interaction-pattern
    description: The interaction pattern or component type the atom addresses.
    matches:
      - modal
      - forms
      - navigation
      - menu
      - dropdown
      - tooltip
      - toast
      - carousel
      - table
      - accordion

  - name: quality-dimension
    description: The quality attribute the atom enforces.
    matches:
      - accessibility
      - a11y
      - performance
      - responsiveness
      - usability
      - readability

contract:
  must_include:
    type: atom-id-array
    description: Atoms that must appear in the retrieved set.
  must_avoid:
    type: atom-id-array
    description: Atoms that must be excluded from the retrieved set.
  register:
    type: string
    description: Design register or persona to apply (e.g. warm-institutional, magazine-editorial).
  typography_required:
    type: string-array
    description: Font families or type scale values that must be cited.
  motion_priority:
    type: enum
    values:
      - high
      - low
      - none
    description: Whether motion atoms should be weighted in retrieval.
