task_type: landing-saas
parent: marketing-landing
description: "Generic SaaS marketing landing page with hero, feature sections, social proof, and pricing CTA."
trigger_keywords:
  - "landing page"
  - "SaaS landing"
  - "marketing site"
  - "产品落地页"
  - "官网首页"
  - "hero section"
  - "feature showcase"
  - "product marketing"
  - "launch page"
default_register_pool:
  - school: warm-institutional
    weight: 0.35
  - school: vercel-clean
    weight: 0.35
  - school: notion-warm
    weight: 0.3
required_atoms:
  - "@community/pattern-hero-with-demo"
  - "@community/pattern-landing-page-sections"
  - "@community/pattern-trust-signal-components"
  - "@community/pattern-top-nav-mega"
  - "@community/rule-single-primary-action-per-screen"
recommended_motion:
  - "@community/pattern-page-load-choreography"
  - "@community/pattern-scroll-reveal"
  - "@community/pattern-fade-in-on-load"
  - "@community/template-gsap-scroll-trigger"
forbidden_atoms:
  - "@impeccable/persona-brutalist"
  - "@community/pattern-dashboard-layout"
quality_checks:
  - "Hero must have a clear value proposition headline above the fold"
  - "Primary CTA must appear in both hero and at least one section below fold"
  - "Navigation must be sticky or have clear scroll-to-top affordance"
  - "Social proof (logos, testimonials, or metrics) must appear before pricing"
  - "All sections must have consistent spacing rhythm"
  - "Page must be fully responsive with no horizontal scroll on mobile"
