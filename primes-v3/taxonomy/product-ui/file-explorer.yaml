task_type: file-explorer
parent: product-ui
description: "File and folder browser with tree navigation, preview panel, and file management actions."
trigger_keywords:
  - "file explorer"
  - "file browser"
  - "folder browser"
  - "文件浏览器"
  - "文件管理"
  - "directory tree"
  - "file manager"
  - "file picker"
  - "asset browser"
default_register_pool:
  - school: linear
    weight: 0.4
  - school: vercel-clean
    weight: 0.35
  - school: notion
    weight: 0.25
required_atoms:
  - "@community/pattern-sidebar-collapsible"
  - "@community/pattern-tx-dnd-kit-nested-tree"
  - "@community/pattern-breadcrumb-trail"
  - "@community/pattern-empty-state"
  - "@community/rule-keyboard-accessible"
  - "@community/pattern-interaction-states"
recommended_motion:
  - "@community/pattern-motion-microinteraction"
  - "@community/pattern-expandable-disclosure"
forbidden_atoms:
  - "@impeccable/persona-magazine-editorial"
  - "@community/template-animated-mesh-background"
quality_checks:
  - "Tree must support keyboard navigation with arrow keys"
  - "Current path must be shown in breadcrumb or address bar"
  - "File type icons must be distinct and accessible (not color-only)"
  - "Empty folders must show a helpful empty state, not just nothing"
  - "Context menu must support rename, delete, and move operations"
  - "Drag-and-drop for file moving must have clear drop targets"
  - "Multi-select must work with Shift+click and Cmd/Ctrl+click"
